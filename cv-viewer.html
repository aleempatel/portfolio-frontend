<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Résumé / CV — Aleem Patel</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .cv-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .cv-frame-wrap {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 1rem;
    }
    .cv-frame-wrap iframe {
      width: 100%;
      max-width: 1000px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0b1220;
    }
    .cv-state {
      margin: auto;
      text-align: center;
      color: #94a3b8;
      max-width: 28rem;
      padding: 2rem;
    }
  </style>
</head>

<body class="cv-page">
  <div class="noise"></div>
  <div class="grid-bg"></div>

  <div class="cv-frame-wrap" id="cvFrameWrap">
    <div class="cv-state" id="cvLoadingState">Loading résumé…</div>
  </div>

  <script src="js/config.js"></script>
  <script>
    (function () {
      const apiRoot = window.PortfolioConfig.apiRoot;
      const viewUrl = `${apiRoot()}/api/profile/resume/view`;

      const wrap = document.getElementById("cvFrameWrap");
      const loadingState = document.getElementById("cvLoadingState");

      // Confirm the résumé actually exists before embedding it, so we can
      // show a friendly message instead of a broken viewer.
      fetch(viewUrl, { method: "HEAD" })
        .then((res) => {
          if (!res.ok) throw new Error("not found");
          loadingState.remove();
          const iframe = document.createElement("iframe");
          iframe.src = viewUrl;
          iframe.title = "Résumé / CV preview";
          iframe.style.height = "calc(100vh - 2rem)";
          wrap.appendChild(iframe);
        })
        .catch(() => {
          loadingState.textContent = "No résumé has been uploaded yet. Please check back later.";
        });
    })();
  </script>
</body>
</html>
